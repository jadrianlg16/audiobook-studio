# Everything here runs with no GPU, no model weights, no Ollama and no secrets.
#
# python: the gateway, pipeline/studio and engine-adapter suites. They use an
#   in-memory fake engine, the studio's offline fake synth and fake director
#   (STUDIO_OFFLINE / STUDIO_FAKE_DIRECTOR, set by the tests themselves), a stub
#   of Breeze's HTTP contract, and fake torch / qwen_tts modules. ffmpeg is
#   installed so the mastering tests run instead of skipping.
# frontend: the Director's Desk (frontend/): generated-types freshness,
#   typecheck, lint, format, Vitest and the production build (`npm run check`),
#   then the Playwright smoke + axe run on the mock API.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            pipeline/requirements.txt
            engines/breeze/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install test dependencies
        run: >
          pip install
          -r gateway/requirements.txt
          -r pipeline/requirements.txt
          -r engines/breeze/requirements.txt
          numpy==2.2.1

      - name: pytest
        run: >
          python -m pytest -q -rs
          gateway/tests
          engines/breeze/tests
          engines/indextts2/tests
          engines/qwen3tts/tests
          pipeline/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run check

      # CI is set by GitHub and PW_CHANNEL is not, so playwright.config.ts
      # uses Playwright's own Chromium rather than an installed Chrome.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
