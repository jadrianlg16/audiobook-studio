server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the gateway (same-origin, so no CORS in production).
    location /api/ {
        proxy_pass http://gateway:8000/api/;
        proxy_set_header Host $host;
        # Match the gateway's REQUEST_TIMEOUT (1800s): first synth on a big GPU
        # engine can download multi-GB weights + warm up. A shorter timeout here
        # would 504 the browser while the gateway/engine are still working.
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        client_max_body_size 50m;       # reference-audio uploads
    }

    # The studio service: books, jobs, passes, exports, and the book files
    # (chapter WAVs, exports) under /studio/books/<slug>/...
    location /studio/ {
        proxy_pass http://studio:8000/;
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;       # a job's SSE stream stays open for hours
        # Job progress is server-sent events: buffering or caching them means the
        # render screen sits at 0% until the job ends.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 200m;      # EPUB uploads
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
