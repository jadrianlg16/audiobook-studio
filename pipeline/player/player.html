<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audiobook player</title>
<style>
  :root{
    --bg:#0b0b0d; --card:#151518; --card2:#1c1c21; --line:#2a2a30;
    --fg:#ececed; --muted:#9a9aa2; --dim:#6f6f77; --accent:#7c74dd; --accent-fg:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 64px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .row{display:flex;gap:12px;align-items:center}
  .cover{width:64px;height:64px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent-fg);flex:none}
  .title{font-size:19px;font-weight:600}
  .sub{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .transcript{max-height:340px;overflow:auto}
  .line{padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
  .line:hover{background:var(--card2)}
  .line.active{background:rgba(124,116,221,.18);color:#cfcbff}
  .line .who{color:var(--dim);font-size:12px;margin-right:6px}
  .scrub{height:8px;border-radius:4px;background:var(--line);position:relative;cursor:pointer;margin-top:8px}
  .scrub > .fill{position:absolute;left:0;top:0;height:8px;border-radius:4px;background:var(--accent);width:0}
  .scrub > .knob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);left:0}
  .times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
  .transport{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.play{width:60px;height:60px;background:var(--accent);border:none;color:var(--accent-fg);font-size:20px}
  button.mini{width:auto;height:auto;border-radius:999px;padding:5px 12px}
  .ctrls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;color:var(--muted);font-size:14px}
  .list .item{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer}
  .list .item:hover{background:var(--card2)}
  .list .item.active{background:rgba(124,116,221,.18);color:#cfcbff}
  .list .item .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%}
  select{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .err{color:#f0a0a0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div class="cover" aria-hidden="true">&#9834;</div>
      <div style="flex:1;min-width:0">
        <div class="title" id="bookTitle">Audiobook</div>
        <div class="sub" id="bookSub"></div>
      </div>
      <div class="sub" id="chapPos"></div>
    </div>

    <div class="grid">
      <div>
        <div class="card" style="background:var(--card2)">
          <h3>Reading</h3>
          <div class="transcript" id="transcript" aria-live="polite"></div>
        </div>

        <div style="margin-top:14px">
          <div class="scrub" id="scrub" role="slider" aria-label="Seek" tabindex="0">
            <div class="fill" id="fill"></div><div class="knob" id="knob"></div>
          </div>
          <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>

        <div class="transport">
          <button id="prevCh" title="Previous chapter" aria-label="Previous chapter">&#9198;</button>
          <button id="back" title="Back 15s" aria-label="Back 15 seconds">&#8630;15</button>
          <button class="play" id="play" aria-label="Play">&#9654;</button>
          <button id="fwd" title="Forward 15s" aria-label="Forward 15 seconds">15&#8631;</button>
          <button id="nextCh" title="Next chapter" aria-label="Next chapter">&#9197;</button>
        </div>

        <div class="ctrls">
          <label>Speed
            <select id="speed">
              <option>0.75</option><option selected>1</option><option>1.25</option>
              <option>1.5</option><option>1.75</option><option>2</option>
            </select>
          </label>
          <button class="mini" id="addBm">&#9733; Bookmark</button>
        </div>
      </div>

      <div>
        <div class="card list">
          <h3>Chapters</h3>
          <div id="chapters"></div>
        </div>
        <div class="card list" style="margin-top:14px">
          <h3>Bookmarks</h3>
          <div id="bookmarks"><div class="sub">None yet</div></div>
        </div>
        <div class="card" style="margin-top:14px">
          <h3>Cast</h3>
          <div id="cast"></div>
        </div>
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const DOTS = ["#7c74dd","#1d9e75","#d85a30","#e0a92a","#378add","#c94f7c"];
let M = null, chapIdx = 0, byChapter = [], voiceColor = {}, curLine = -1, bmKey = "";

const fmt = (s) => { s=Math.max(0,s|0); const m=(s/60)|0; return m+":"+String(s%60).padStart(2,"0"); };

async function boot(){
  try{
    M = await (await fetch("manifest.json",{cache:"no-store"})).json();
  }catch(e){ $("err").textContent = "Could not load manifest.json — serve this folder over http (e.g. python -m http.server)."; return; }
  bmKey = "audiobook:bm:"+(M.meta.title||M.meta.source_path||"book");
  $("bookTitle").textContent = M.meta.title || "Audiobook";
  const genre = M.profile && M.profile.label && M.meta.book_type !== "unknown" ? M.profile.label : null;
  $("bookSub").textContent = [M.meta.author, "narrated by Kokoro", genre].filter(Boolean).join(" · ");
  byChapter = M.chapters.map(c => M.utterances.filter(u => u.chapter_index === c.index));
  (M.cast||[]).forEach((c,i)=> voiceColor[c.character] = DOTS[i%DOTS.length]);
  renderChapters(); renderCast(); renderBookmarks();
  const saved = JSON.parse(localStorage.getItem("audiobook:pos:"+bmKey)||"null");
  setChapter(saved? saved.ch : 0, saved? saved.t : 0);
}

function renderChapters(){
  $("chapters").innerHTML = "";
  M.chapters.forEach(c => {
    const d = document.createElement("div");
    d.className = "item"+(c.index===chapIdx?" active":"");
    d.innerHTML = `<span>${c.index+1} · ${c.title||("Chapter "+(c.index+1))}</span><span class="t">${fmt((c.duration_ms||0)/1000)}</span>`;
    d.onclick = () => setChapter(c.index, 0, true);
    $("chapters").appendChild(d);
  });
}
function renderCast(){
  $("cast").innerHTML = (M.cast||[]).map(c =>
    `<span class="chip"><span class="dot" style="background:${voiceColor[c.character]}"></span>${c.character} · ${c.voice_id}</span>`).join("") || '<span class="sub">Single narrator</span>';
}
function renderTranscript(){
  const box = $("transcript"); box.innerHTML = "";
  byChapter[chapIdx].forEach((u,i) => {
    const d = document.createElement("div");
    d.className = "line"; d.dataset.i = i;
    const who = u.speaker && u.speaker!=="Narrator" ? `<span class="who">${u.speaker}</span>` : "";
    d.innerHTML = who + u.text;
    d.onclick = () => { if(u.audio){ audio.currentTime = u.audio.start_ms/1000; audio.play(); } };
    box.appendChild(d);
  });
  curLine = -1;
}
function setChapter(i, t=0, autoplay=false){
  if(i<0||i>=M.chapters.length) return;
  chapIdx = i;
  const c = M.chapters[i];
  audio.src = c.audio_file;
  audio.playbackRate = parseFloat($("speed").value);
  renderTranscript(); renderChapters();
  $("chapPos").textContent = `Chapter ${i+1} of ${M.chapters.length}`;
  audio.currentTime = t||0;
  if(autoplay) audio.play();
}

function tick(){
  const ms = audio.currentTime*1000, lines = byChapter[chapIdx];
  let idx = -1;
  for(let k=0;k<lines.length;k++){ const a=lines[k].audio; if(a && ms>=a.start_ms && ms<a.end_ms){ idx=k; break; } }
  if(idx!==curLine){
    const box=$("transcript");
    if(curLine>=0 && box.children[curLine]) box.children[curLine].classList.remove("active");
    if(idx>=0 && box.children[idx]){ const el=box.children[idx]; el.classList.add("active"); el.scrollIntoView({block:"nearest",behavior:"smooth"}); }
    curLine=idx;
  }
  const dur=audio.duration||((M.chapters[chapIdx].duration_ms||0)/1000);
  const pct = dur? (audio.currentTime/dur*100):0;
  $("fill").style.width=pct+"%"; $("knob").style.left=pct+"%";
  $("cur").textContent=fmt(audio.currentTime); $("dur").textContent=fmt(dur);
}

function savePos(){ localStorage.setItem("audiobook:pos:"+bmKey, JSON.stringify({ch:chapIdx,t:audio.currentTime})); }
function renderBookmarks(){
  const bms = JSON.parse(localStorage.getItem(bmKey)||"[]");
  const box=$("bookmarks");
  if(!bms.length){ box.innerHTML='<div class="sub">None yet</div>'; return; }
  box.innerHTML="";
  bms.forEach((b,i)=>{
    const d=document.createElement("div"); d.className="item";
    d.innerHTML=`<span>&#9733; ${b.label}</span><span class="t">${fmt(b.t)}</span>`;
    d.onclick=()=>setChapter(b.ch,b.t,true);
    d.oncontextmenu=(e)=>{e.preventDefault(); bms.splice(i,1); localStorage.setItem(bmKey,JSON.stringify(bms)); renderBookmarks();};
    box.appendChild(d);
  });
}
$("addBm").onclick=()=>{
  const bms=JSON.parse(localStorage.getItem(bmKey)||"[]");
  const line=byChapter[chapIdx][Math.max(0,curLine)];
  const label=(M.chapters[chapIdx].title||("Ch "+(chapIdx+1)))+" — "+((line&&line.text)||"").slice(0,32);
  bms.push({ch:chapIdx,t:audio.currentTime,label}); localStorage.setItem(bmKey,JSON.stringify(bms)); renderBookmarks();
};

$("play").onclick=()=> audio.paused? audio.play() : audio.pause();
$("back").onclick=()=> audio.currentTime=Math.max(0,audio.currentTime-15);
$("fwd").onclick=()=> audio.currentTime=Math.min(audio.duration||1e9,audio.currentTime+15);
$("prevCh").onclick=()=> setChapter(chapIdx-1,0,true);
$("nextCh").onclick=()=> setChapter(chapIdx+1,0,true);
$("speed").onchange=()=> audio.playbackRate=parseFloat($("speed").value);
$("scrub").onclick=(e)=>{ const r=e.currentTarget.getBoundingClientRect(); const p=(e.clientX-r.left)/r.width; audio.currentTime=p*(audio.duration||0); };

audio.addEventListener("timeupdate",()=>{tick(); if((audio.currentTime|0)%5===0) savePos();});
audio.addEventListener("play",()=>{$("play").innerHTML="&#10074;&#10074;"; $("play").setAttribute("aria-label","Pause");});
audio.addEventListener("pause",()=>{$("play").innerHTML="&#9654;"; $("play").setAttribute("aria-label","Play"); savePos();});
audio.addEventListener("ended",()=>{ if(chapIdx+1<M.chapters.length) setChapter(chapIdx+1,0,true); });
document.addEventListener("keydown",(e)=>{ if(e.code==="Space"){e.preventDefault();$("play").click();} if(e.code==="ArrowLeft")$("back").click(); if(e.code==="ArrowRight")$("fwd").click(); });

boot();
</script>
</body>
</html>
